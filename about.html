        var cookieBanner = document.getElementById('cookie-banner');

        var cookieSettings = document.getElementById('cookie-settings');
        if(cookieBanner && cookieClose) {
            cookieClose.addEventListener('click', function() {
                cookieBanner.style.display = 'none';
            });
        }
        if(cookieBanner && cookieAccept) {
            cookieAccept.addEventListener('click', function() {
                cookieBanner.style.display = 'none';
                // Here you can set a cookie or localStorage to remember consent
            });
        }
        if(cookieBanner && cookieSettings) {
            cookieSettings.addEventListener('click', function() {
                var modal = document.getElementById('cookie-modal');
                if(modal) modal.style.display = 'flex';
            });
        }
        var cookieModal = document.getElementById('cookie-modal');
        var cookieModalClose = document.getElementById('cookie-modal-close');
        if(cookieModal && cookieModalClose) {
            cookieModalClose.addEventListener('click', function() {
                cookieModal.style.display = 'none';
            });
            // Optional: close modal when clicking outside the modal content
            cookieModal.addEventListener('click', function(e) {
                if(e.target === cookieModal) cookieModal.style.display = 'none';
            });
        }
        // Cookie Modal Show More logic
        var cookieModalText = document.getElementById('cookie-modal-text');
        var cookieModalShowMore = document.getElementById('cookie-modal-showmore');
        var fullText = "This website uses cookies to improve your experience while you navigate through the website. Out of these, the cookies that are categorized as necessary are stored on your browser as they are essential for the working of basic functionalities of the website. We also use third-party cookies that help us analyze and understand how you use this website. These cookies will be stored in your browser only with your consent. You also have the option to opt-out of these cookies. But opting out of some of these cookies may affect your browsing experience.";
        var shortText = fullText.slice(0, 258) + (fullText.length > 258 ? '...' : '');
        if(cookieModalText && cookieModalShowMore) {
            cookieModalText.textContent = shortText;
            cookieModalShowMore.style.display = fullText.length > 258 ? 'inline-block' : 'none';
            cookieModalShowMore.addEventListener('click', function() {
                cookieModalText.textContent = fullText;
                cookieModalShowMore.style.display = 'none';
            });
        }
        // Cookie toggles switch logic (all except essential)
        var cookieSwitches = document.querySelectorAll('.cookie-switch');
        cookieSwitches.forEach(function(switchEl) {
            var input = switchEl.querySelector('input[type="checkbox"]');
            var bg = switchEl.querySelector('.cookie-bg');
            var knob = switchEl.querySelector('.cookie-knob');
            function updateSwitch() {
                if (input.checked) {
                    bg.style.backgroundColor = '#1a237e';
                    knob.style.left = '21px';
                } else {
                    bg.style.backgroundColor = '#ccc';
                    knob.style.left = '3px';
                }
            }
            input.addEventListener('change', updateSwitch);
            updateSwitch();
        });
        // Expand/collapse logic for cookie descriptions
        var expandBtns = document.querySelectorAll('.cookie-expand');
        var descs = document.querySelectorAll('.cookie-desc');
        expandBtns.forEach(function(btn, idx) {
            btn.addEventListener('click', function() {
                var desc = descs[idx];
                var expanded = desc.style.display === 'block';
                desc.style.display = expanded ? 'none' : 'block';
                btn.innerHTML = expanded ? '&#9654;' : '&#9660;';
            });
        });
        // Save & Accept button handler
        var saveAcceptBtn = document.getElementById('cookie-save-accept');
        if (saveAcceptBtn) {
            saveAcceptBtn.addEventListener('click', function() {

                    functional: document.getElementById('functional-toggle').checked,
                    analytics: document.getElementById('analytics-toggle').checked,
                    performance: document.getElementById('performance-toggle').checked,
                    advertisement: document.getElementById('advertisement-toggle').checked,
                    social: document.getElementById('social-toggle').checked,
                    unclassified: document.getElementById('unclassified-toggle').checked
                };

                if(cookieModal) cookieModal.style.display = 'none';
                // Optionally, hide the banner as well
                var cookieBanner = document.getElementById('cookie-banner');
                if(cookieBanner) cookieBanner.style.display = 'none';
            });
        }
